# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Tianpao"
  productName: "DeEarthX V3"
  productIdentifier: "top.tianpao.deearthx"
  description: "Minecraft Modpack to Server Converter"
  copyright: "(c) 2025, Tianpao"
  comments: "Convert modpacks to server files"
  version: "3.0.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend/node_modules
      - bin
      - instance
      - templates
      - example
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
fileAssociations:
  - ext: mrpack
    name: Modrinth Modpack
    description: Modrinth Modpack File
    iconName: modpackIcon
    role: Editor
  - ext: zip
    name: CurseForge Modpack
    description: CurseForge Modpack File
    iconName: modpackIcon
    role: Editor